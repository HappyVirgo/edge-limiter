apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: edge-limiter
  labels:
    app.kubernetes.io/name: edge-limiter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edge-limiter
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
