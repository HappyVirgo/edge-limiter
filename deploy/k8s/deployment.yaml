apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-limiter
  labels:
    app.kubernetes.io/name: edge-limiter
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-limiter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-limiter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: edge-limiter
      containers:
        - name: edge-limiter
          image: ghcr.io/happyvirgo/edge-limiter:0.1.0 # placeholder: push your own image
          args: ["-config", "/etc/edge-limiter/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: EDGE_LIMITER_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: edge-limiter-redis
                  key: password
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5 # let endpoints drop the pod before SIGTERM; needs Kubernetes >= 1.30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/edge-limiter
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: edge-limiter
