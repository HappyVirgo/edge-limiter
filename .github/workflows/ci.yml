name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race -count=1 ./...
      - name: build
        run: go build ./...
      - name: benchmarks compile and run once
        run: go test -run '^$' -bench . -benchtime 100x ./bench

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt
        run: terraform fmt -check -recursive deploy/terraform
      - name: terraform validate (module via example)
        working-directory: deploy/terraform/examples/basic
        run: |
          terraform init -backend=false -input=false
          terraform validate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: edge-limiter:ci
          load: true
      - name: smoke test image
        run: |
          docker run -d --name el -p 8080:8080 edge-limiter:ci
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && break; sleep 0.5; done
          curl -fs -X POST localhost:8080/v1/check -d '{"key":"ci","cost":1}'
          docker logs el
          docker rm -f el
